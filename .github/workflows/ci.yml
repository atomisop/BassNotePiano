name: CI

# STEP 23, CI/CD. Runs on every PR against main, plus pushes to main itself
# (so a direct push, an admin bypass, a merge commit, still gets checked,
# not just the PR that preceded it). Deliberately does NOT deploy or merge
# anything: Netlify's own GitHub integration already handles deploys on its
# own trigger, and "do not automatically merge" is explicit in the master
# spec, this workflow's only job is to turn red when something's actually
# broken, nothing more.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # Every DATABASE_URL/DIRECT_URL fallback below already points at
    # postgresql://ci:ci@localhost:5432/ci, that only resolves if
    # something is actually listening there. Without this service,
    # `prisma generate` is fine (it only reads the schema file), but
    # `npm run build`'s `prisma migrate deploy` step fails outright with
    # "Can't reach database server at localhost:5432", confirmed against
    # this workflow's real run history (every run since it was added).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # rework:verify and glass:verify check that each evidence file names a real commit,
          # which a one-commit shallow clone cannot answer.
          fetch-depth: 0

      # A squash merge leaves the branch's own commits out of main's history (and the branch is
      # deleted), but GitHub keeps them under refs/pull/*/head. The evidence verifiers need them.
      - run: git fetch --quiet origin '+refs/pull/*/head:refs/remotes/pull/*'

      # Matches .nvmrc / package.json's engines.node (pinned in an earlier
      # step this session), same Node version in CI as in dev and on
      # Netlify, not a separate floating version.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      # Fails the build on a high or critical known vulnerability in a package that ships to production.
      - run: npm audit --omit=dev --audit-level=high

      # prisma generate (also wired as postinstall, so `npm ci` above
      # already ran it once), repeated explicitly so this step's intent
      # reads clearly in the Actions log, and so it's not silently relying
      # on postinstall firing correctly. Only needs DATABASE_URL to be SET,
      # not to point at a real reachable database, generating the client
      # reads the schema file, it doesn't connect.
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run rework:verify
      - run: npm run glass:verify

      # NOTE, honestly: this step has not been verified against a real
      # GitHub Actions run, doing that would mean pushing to trigger CI,
      # which wasn't done as part of building this workflow. `next build`
      # may reach for other env vars (NEXTAUTH_SECRET, R2 credentials, the
      # Resend key) depending on what runs at build time versus only at
      # request time; the dummy values below cover the ones most likely to
      # matter. If the first real run of this workflow fails here on a
      # missing/invalid env var, that's the thing to fix, not a sign the
      # whole approach is wrong.
      - run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-placeholder-secret-not-for-production-use' }}
          NEXTAUTH_URL: "http://localhost:3000"

      # The build above has applied every migration to the throwaway Postgres, so the
      # database-backed tests (booking rules, support cases, payments, login codes,
      # backups) run here against a real database.
      - run: npm run test:db
        env:
          # Always the throwaway database, never a secret: these tests create and delete rows.
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci"
          NEXTAUTH_SECRET: "ci-placeholder-secret-not-for-production-use"
          NEXTAUTH_URL: "http://localhost:3000"
          RESEND_API_KEY: ""
