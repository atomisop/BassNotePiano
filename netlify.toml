[build]
  command = "npm run build"
  publish = ".next"
  # Builds are metered, so a push that changes only docs, tests, scripts or notes does not build or deploy. Netlify skips the
  # build when this command exits 0, and git diff --quiet exits 0 only when NONE of the listed paths changed since the last
  # deployed commit. Anything that can change the live app is listed: source, database migrations, the scheduled functions,
  # public files, dependencies and the build and framework settings. If the command fails for any reason (no earlier commit
  # to compare to, which makes the quoted value empty and git fail), it exits non-zero and the site builds as usual, so a mistake here can only cost a build, never skip one.
  ignore = 'git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- src prisma netlify public package.json package-lock.json next.config.mjs netlify.toml postcss.config.mjs tsconfig.json sentry.edge.config.ts sentry.server.config.ts .nvmrc .eslintrc.json'

[build.environment]
  # Pinned to the current Active LTS line (Node 24, "Krypton"). Comfortably
  # covers the currently-installed Next.js 14 (wants Node ^18.17 || >=20.5)
  # and the Next.js 16 requirement (>=20.9) planned in the Step 3 migration
  # doc, so this shouldn't need touching again when that upgrade lands.
  # Before this, Netlify's build image used its own unpinned default, which
  # could silently drift from whatever a developer's local machine runs.
  NODE_VERSION = "24"
  # Netlify's build machine gave Node a heap of about 2 GB, and the production build runs out of it while compiling ("JavaScript heap
  # out of memory", exit code 134, which Netlify shows as exit code 2). Every production deploy failed that way from 2026-11-11 on.
  # 4 GB gives the compile room. GitHub's CI machine has more memory, so its build never showed the problem.
  NODE_OPTIONS = "--max-old-space-size=4096"
  # Netlify fails a build when the value of an environment variable appears in a committed file. A bucket name is not a secret
  # and the setup doc (docs/PRIVATE-LESSON-FILES.md) names it, so this one key is exempt. Real secrets stay scanned.
  SECRETS_SCAN_OMIT_KEYS = "R2_PRIVATE_BUCKET_NAME"

[functions]
  directory = "netlify/functions"

[[plugins]]
  package = "@netlify/plugin-nextjs"
