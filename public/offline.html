<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>You're offline | Bass Note Piano</title>
    <!-- Shown by the service worker (sw.js) when a page is opened with no internet, instead of the browser's own offline page.
         Everything is inline: there is no network to load anything else from. Follows the person's light or dark choice. -->
    <style>
      :root {
        --ground: #000000;
        --text: #faf6ee;
        --muted: #baae9f;
        --accent: rgb(232 100 30);
        --tile: rgb(250 246 238 / 0.06);
        --line: rgb(250 246 238 / 0.1);
        color-scheme: dark;
      }
      :root[data-mode="light"] {
        --ground: #efe8dc;
        --text: #000000;
        --muted: #56473f;
        --accent: rgb(232 100 30);
        --tile: rgb(36 28 24 / 0.05);
        --line: rgb(36 28 24 / 0.1);
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--ground);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0;
        padding: calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px);
        text-align: center;
      }
      .logo {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        position: fixed;
        top: calc(env(safe-area-inset-top) + 16px);
        left: 16px;
      }
      .icon {
        width: 88px;
        height: 88px;
        border-radius: 28px;
        display: grid;
        place-items: center;
        background: var(--tile);
        box-shadow: inset 0 0 0 1px var(--line);
        color: var(--accent);
      }
      h1 {
        margin: 24px 0 0;
        font-size: 28px;
        line-height: 1.15;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      p {
        margin: 10px 0 0;
        max-width: 22rem;
        font-size: 16px;
        line-height: 1.5;
        color: var(--muted);
        text-wrap: pretty;
      }
      button {
        margin-top: 28px;
        min-height: 48px;
        padding: 0 28px;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: #000000;
        font: inherit;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      .hint {
        margin-top: 16px;
        font-size: 13px;
      }
    </style>
    <script>
      // The same light or dark choice as the app (Settings > Appearance), read before anything paints.
      try {
        var t = localStorage.getItem("bnp-theme") || "ink";
        if (t === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "ink" : "paper";
        if (t === "paper") {
          document.documentElement.setAttribute("data-mode", "light");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#efe8dc");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <img class="logo" src="/logo-mark.png" alt="Bass Note Piano" width="44" height="44" />
    <main>
      <div class="icon" aria-hidden="true">
        <svg width="44" height="44" viewBox="0 0 256 256" fill="currentColor">
          <path d="M213.92,210.62a8,8,0,1,1-11.84,10.76l-52-57.15a60,60,0,0,0-57.41,7.24,8,8,0,1,1-9.42-12.93A75.43,75.43,0,0,1,128,144c1.28,0,2.55,0,3.82.1L104.9,114.49A108,108,0,0,0,61,135.31,8,8,0,0,1,49.73,134,8,8,0,0,1,51,122.77a124.27,124.27,0,0,1,41.71-21.66L69.37,75.4a155.43,155.43,0,0,0-40.29,24A8,8,0,0,1,18.92,87,171.87,171.87,0,0,1,58,62.86L42.08,45.38A8,8,0,1,1,53.92,34.62ZM128,192a12,12,0,1,0,12,12A12,12,0,0,0,128,192ZM237.08,87A172.3,172.3,0,0,0,106,49.4a8,8,0,1,0,2,15.87A158.33,158.33,0,0,1,128,64a156.25,156.25,0,0,1,98.92,35.37A8,8,0,0,0,237.08,87ZM195,135.31a8,8,0,0,0,11.24-1.3,8,8,0,0,0-1.3-11.24,124.25,124.25,0,0,0-51.73-24.2A8,8,0,1,0,150,114.24,108.12,108.12,0,0,1,195,135.31Z" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>Check your Wi-Fi or mobile data. This page opens by itself as soon as you're back online.</p>
      <button type="button" id="retry">Try again</button>
      <p class="hint" id="hint" role="status" aria-live="polite"></p>
    </main>
    <script>
      (function () {
        var hint = document.getElementById("hint");
        document.getElementById("retry").addEventListener("click", function () {
          if (navigator.onLine) location.reload();
          else hint.textContent = "Still no connection. We'll keep trying.";
        });
        window.addEventListener("online", function () {
          location.reload();
        });
      })();
    </script>
  </body>
</html>
